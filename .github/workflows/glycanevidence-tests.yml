name: GlycanEvidence synthetic tests

on:
  push:
    branches: [main]
    paths:
      - 'projects/milk_gut_scfa_plateau/glycan-evidence/**'
      - 'projects/milk_gut_scfa_plateau/methods/**'
      - '.github/workflows/glycanevidence-tests.yml'
  pull_request:
    paths:
      - 'projects/milk_gut_scfa_plateau/glycan-evidence/**'
      - 'projects/milk_gut_scfa_plateau/methods/**'
      - '.github/workflows/glycanevidence-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the public core with numerical and BAM dependencies
        run: python -m pip install './projects/milk_gut_scfa_plateau/glycan-evidence[inference,structure]'
      - name: Run synthetic core tests
        working-directory: projects/milk_gut_scfa_plateau/glycan-evidence
        run: python -m unittest discover -s tests -v
      - name: Run structure-comparison tests
        working-directory: projects/milk_gut_scfa_plateau/methods/structure-comparison
        run: python -m unittest discover -v
      - name: Install sequence-method test dependencies
        working-directory: projects/milk_gut_scfa_plateau/methods/sequence-and-population
        run: python -m pip install -r requirements-test.txt
      - name: Run synthetic sequence and population tests
        working-directory: projects/milk_gut_scfa_plateau/methods/sequence-and-population
        run: python -B run_synthetic_tests.py
